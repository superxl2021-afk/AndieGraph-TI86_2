name: Android CI desde ZIP

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Descomprimir el proyecto
      run: unzip *.zip

    - name: Parchear Codigo en C e Inyectar Modo Acelerado Sano
      run: |
        # Incluye las librerías estándar de C necesarias
        sed -i '1s/^/#include <time.h>\n#include <unistd.h>\n#include <string.h>\n/' app/src/main/jni/ti8x.c
        
        # En lugar de borrar usleep, lo reducimos al mínimo (1 microsegundo) para que la app no se rompa pero corra a máxima velocidad
        sed -i 's/usleep(periodUsec);/usleep(1);/g' app/src/main/jni/ti8x.c
        sed -i 's/usleep(1000);/usleep(1);/g' app/src/main/jni/ti8x.c

    - name: Corregir clases duplicadas y Activar MultiDex
      run: |
        echo -e "\nconfigurations.all { resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' }" >> app/build.gradle
        sed -i '/defaultConfig {/a \        multiDexEnabled true' app/build.gradle
        sed -i '/dependencies {/a \    implementation "androidx.multidex:multidex:2.0.1"' app/build.gradle

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: andiegraph-apk
        path: app/build/outputs/apk/debug/app-debug.apk
